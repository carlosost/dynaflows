# Playbook 4.3: fast tests first, slow tests last, and the environment matches
# what developers run -- same interpreter, same lockfile, no independent
# resolve. A CI job that resolves its own dependencies tests a different
# program than the one that ships.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install from the lockfile
        run: uv sync --locked --all-groups

      # [1] lint + format  (<10s)
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # [2] type check  (<20s)
      - name: Typecheck
        run: uv run mypy

      # [3] architectural constraints -- ADR-010
      - name: Architecture lint
        run: uv run python scripts/lint_architecture.py

      # [4] deterministic tier  (<60s) -- hard gate, must be 100%
      - name: Deterministic tests
        run: uv run pytest -m deterministic

      # [5] AP-13: run the documented setup path exactly as written, from a
      # clean tree, with no exported convenience variables. This is the only
      # test of the instructions themselves.
      - name: Documented setup path
        run: |
          rm -rf .venv
          make install
          make test

      # [6] The CLI must work when run from the INSTALLED artifact, not just
      # under the test runner (AP-13). Two assertions, and note the second is
      # inverted on purpose.
      - name: CLI runs from the installed artifact
        run: |
          set -euo pipefail
          uv run dynaflows version

          # CI has no credentials, by design and permanently. `doctor` MUST
          # fail here -- that is the environment check doing its job (AP-05).
          # An earlier version of this workflow asserted the opposite and could
          # never have passed. Asserting the FAILURE is the useful test: it
          # proves the checks execute against the shipped package and that the
          # exit code is honest, and it breaks loudly if doctor ever starts
          # passing without credentials.
          if uv run dynaflows doctor --offline; then
            echo "::error::doctor passed with no credentials; the environment check is broken"
            exit 1
          fi
          echo "doctor correctly refused to pass without credentials"
