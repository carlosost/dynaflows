# Playbook 4.3: fast tests first, slow tests last, and the environment matches
# what developers run -- same interpreter, same lockfile, no independent
# resolve. A CI job that resolves its own dependencies tests a different
# program than the one that ships.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from the lockfile
        run: uv sync --locked --all-groups

      # [1] lint + format  (<10s)
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # [2] type check  (<20s)
      - name: Typecheck
        run: uv run mypy

      # [3] architectural constraints -- ADR-010
      - name: Architecture lint
        run: uv run python scripts/lint_architecture.py

      # [4] deterministic tier  (<60s) -- hard gate, must be 100%
      - name: Deterministic tests
        run: uv run pytest -m deterministic

      # [5] AP-13: run the documented setup path exactly as written, from a
      # clean tree, with no exported convenience variables. This is the only
      # test of the instructions themselves.
      - name: Documented setup path
        run: |
          rm -rf .venv
          make install
          make test

      # Offline doctor: no credentials in CI, so only the local checks run.
      # It still proves the CLI is installed and importable from the artifact.
      - name: Doctor (offline)
        run: uv run dynaflows doctor --offline
